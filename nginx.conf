# Rate limiting zones
limit_req_zone $binary_remote_addr zone=mps_general:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=mps_ai:10m rate=20r/m;

server {
    listen 80;
    server_name localhost;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # --- SECURITY HEADERS ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self'; object-src 'none'; frame-ancestors 'none';" always;

    # --- OLLAMA PROXY (rate limited) ---
    location /ollama-api/ {
        limit_req zone=mps_ai burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://100.x.x.x:11434/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # --- SPEECH PROXY (rate limited) ---
    location /ai-speech/ {
        limit_req zone=mps_ai burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://host.docker.internal:10500/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # --- SPA ROUTING ---
    location / {
        limit_req zone=mps_general burst=20 nodelay;
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /index.html;
    error_page 429 @too_many_requests;
    error_page 500 502 503 504 /index.html;

    location @too_many_requests {
        return 429 '{"error":"Rate limit exceeded. Please wait before retrying."}';
        add_header Content-Type application/json;
    }
}
