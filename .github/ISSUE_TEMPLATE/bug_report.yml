name: Bug Report
description: Report a bug or unexpected behaviour
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please fill in as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this behaviour?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the system is affected?
      options:
        - Resident Chat
        - Staff Dashboard
        - Approvals
        - AI Agent / Causality Engine
        - Queue Management
        - Analytics
        - Authentication
        - Document Upload
        - AI Proxy (api/server.js)
        - Database
        - Docker / Infrastructure
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any error messages or logs (use code blocks).
      render: shell

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        - OS:
        - Docker version:
        - Node version:
        - Ollama model:
      placeholder: |
        - OS: Ubuntu 24.04
        - Docker: 27.x
        - Node: 20.x
        - Ollama model: gemma4:e2b
