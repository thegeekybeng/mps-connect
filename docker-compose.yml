services:
  mps-connect:
    image: node:20-alpine
    container_name: mps-connect
    working_dir: /app
    volumes:
      - /volume1/compose/mps-connect:/app
    command: >
      sh -c "npm install && npm run dev -- --host"
    ports:
      - "3080:3000"
    environment:
      - VITE_OLLAMA_HOST=/ollama-api
      - VITE_OLLAMA_MODEL=gemma4:e2b
      - VITE_SPEECH_HOST=/ai-speech
      # Loaded from .env — never hardcode this value here
      - VITE_STAFF_ACCESS_CODE=${VITE_STAFF_ACCESS_CODE}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    restart: unless-stopped
    networks:
      - ai-bridge

networks:
  ai-bridge:
    external: true