version: '3.8'

services:
  mps-connect:
    # Use standard Node image (No build step = No crashes on NAS)
    image: node:20-alpine
    container_name: mps-connect
    working_dir: /app
    
    # Map your NAS folder to the container
    # IMPORTANT: Ensure '/volume1/docker/mps-connect' matches your actual path
    volumes:
      - /volume1/compose/mps-connect:/app

    # Install dependencies and run in dev mode
    command: >
      sh -c "npm install && npm run dev -- --host"

    # Map port 3080 on NAS to 3000 in container
    ports:
      - "3080:3000"

    environment:
      # Vite requires VITE_ prefix to expose env vars to the browser bundle
      - VITE_OLLAMA_HOST=/ollama-api
      - VITE_OLLAMA_MODEL=aisingapore/gemma-sea-lion-v4-27b-it
      - VITE_SPEECH_HOST=/ai-speech

    restart: unless-stopped