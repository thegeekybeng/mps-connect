services:
  mps-connect:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_SPEECH_HOST=${VITE_SPEECH_HOST}
        - VITE_STAFF_ACCESS_CODE=${VITE_STAFF_ACCESS_CODE}
        # VITE_OLLAMA_HOST and VITE_OLLAMA_MODEL removed — AI now goes via server-side proxy
    container_name: mps-connect
    ports:
      - "3080:80"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - ai-bridge
    depends_on:
      mps-ai-proxy:
        condition: service_healthy

  # Server-side AI proxy — system prompt, PII masking, canary tokens,
  # injection sanitization, and audit logging all live here.
  # The browser never contacts Ollama directly.
  mps-ai-proxy:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: mps-ai-proxy
    environment:
      - OLLAMA_ENDPOINT=${OLLAMA_ENDPOINT:-http://100.x.x.x:11434/api/chat}
      - AI_MODEL=${AI_MODEL:-gemma4:e2b}
      - PORT=3103
      # Singpass FAPI v3 — MockPass for dev, real NDI endpoints for production
      - SINGPASS_BASE_URL=${SINGPASS_BASE_URL:-http://mockpass:5156}
      - SINGPASS_CLIENT_ID=${SINGPASS_CLIENT_ID:-mps-connect}
      - SINGPASS_REDIRECT_URI=${SINGPASS_REDIRECT_URI:-https://mps-connect.thegeekybeng.com/auth/singpass/callback}
      - SESSION_SECRET=${SESSION_SECRET:-change-in-production}
      - NODE_ENV=${NODE_ENV:-development}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3103/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: "0.5"
    restart: unless-stopped
    networks:
      - ai-bridge
    depends_on:
      mockpass:
        condition: service_healthy

  # MockPass — dev-only Singpass/CorpPass mock server (OGP)
  # Phase 3 placeholder: swap SINGPASS_BASE_URL to real NDI endpoint for production.
  # NOT exposed externally — internal Docker network only.
  mockpass:
    image: node:20-alpine
    container_name: mockpass
    working_dir: /app
    command: sh -c "npm install --silent @opengovsg/mockpass && npx mockpass"
    environment:
      - SHOW_LOGIN_PAGE=true
      - MOCKPASS_PORT=5156
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5156/singpass/v3/fapi/.well-known/openid-configuration"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    restart: unless-stopped
    networks:
      - ai-bridge

networks:
  ai-bridge:
    external: true