services:
  mps-connect:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_OLLAMA_HOST=${VITE_OLLAMA_HOST}
        - VITE_OLLAMA_MODEL=${VITE_OLLAMA_MODEL}
        - VITE_SPEECH_HOST=${VITE_SPEECH_HOST}
        - VITE_STAFF_ACCESS_CODE=${VITE_STAFF_ACCESS_CODE}
    container_name: mps-connect
    ports:
      - "3080:80"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - ai-bridge

networks:
  ai-bridge:
    external: true